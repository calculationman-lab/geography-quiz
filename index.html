<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>小4社会 学習クイズ</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <meta name="theme-color" content="#2457a7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="社会クイズ">
  <link rel="apple-touch-icon" href="./icon-192.png">
</head>
<body>
  <main class="app-shell">
    <section id="home-screen" class="screen">
      <header class="hero"><p class="eyebrow">小学4年生</p><h1>社会 学習クイズ</h1><p>4択問題で楽しく力だめし！</p></header>
      <div class="today-card" id="today-status"></div>
      <div class="mode-grid">
        <article class="mode-card geography-card">
          <div class="mode-icon" aria-hidden="true">🗾</div>
          <div><p class="mode-label">地理</p><h2>日本の地理クイズ</h2><p><span id="question-total">139</span>問からランダムに20問出題</p></div>
          <button id="start-button" class="primary">20問スタート</button>
        </article>
      </div>
      <section class="history-section">
        <div class="section-heading"><h2>これまでの記録</h2><button id="clear-history-button" class="text-button">記録を消す</button></div>
        <div id="history-list" class="history-list"></div>
      </section>
    </section>
    <section id="quiz-screen" class="screen hidden" aria-live="polite">
      <div class="quiz-card">
        <div class="quiz-meta"><button id="quit-button" class="back-button" aria-label="クイズをやめてTOPへ戻る">← TOP</button><span id="region" class="tag"></span><span id="progress"></span></div>
        <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
        <h1 id="question" class="question"></h1><div id="choices" class="choices"></div><div id="feedback" class="feedback hidden"></div>
        <button id="next-button" class="primary hidden">次の問題</button>
      </div>
    </section>
    <section id="result-screen" class="screen hidden">
      <div class="result-card">
        <p class="eyebrow">結果発表</p><h1 id="result-title"></h1><div class="score-ring"><strong id="result-score"></strong><span id="result-rate"></span></div><p id="result-time" class="result-time"></p>
        <div id="wrong-section" class="wrong-section"></div><button id="review-button" class="secondary hidden"></button><button id="home-button" class="primary">TOPへ戻る</button>
      </div>
    </section>
  </main>
  <script src="./questions.js"></script><script src="./app.js"></script>
  <script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.error))}</script>
</body>
</html>
